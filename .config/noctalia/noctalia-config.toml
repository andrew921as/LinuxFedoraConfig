[accessibility]
ui_scale = 0.90000000596046448

[bar.default]
background_opacity = 0.0
compositor_blur = false
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "JetBrainsMono Nerd Font Mono"
font_scale = 0.87999998778104782
font_weight = 300
scale = 1.2500000111758709
shadow = false
start = [ "wallpaper", "workspaces" ]
thickness = 30
widget_spacing = 7

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 807.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "JetBrainsMono Nerd Font Mono"
show_close_buttons = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-monochrome"

[wallpaper.default]
path = "/home/andrew921/Pictures/Wallpapers/SaturnMoon.jpeg"

[wallpaper.last]
path = "/home/andrew921/Pictures/Wallpapers/SaturnMoon.jpeg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/andrew921/Pictures/Wallpapers/SaturnMoon.jpeg"

[wallpaper.monitors.eDP-1]
path = "/home/andrew921/Pictures/Wallpapers/SaturnMoon.jpeg"

[widget.brightness]
enabled = false

[widget.network]
font_scale = 0.96999999999999997
scale = 0.90000000000000013
show_label = false

[widget.workspaces]
active_pill_size = 1.5
focused_output_only = true
show_all_outputs = true
